# LabVIEW CI — thin caller. All logic lives in the shared reusable workflow;
# this file owns only the triggers. Updates arrive automatically through the
# moving major tag (@v4); Dependabot can also bump it.
name: LabVIEW CI

on:
  pull_request:
    paths: ['**.vi', '**.ctl', '**.lvproj', '**.lvlib', '**.lvclass']
  push:
    branches: [develop]
    paths: ['**.vi', '**.ctl', '**.lvproj', '**.lvlib', '**.lvclass']
  workflow_dispatch:

jobs:
  labview-ci:
    permissions:
      contents: write
      statuses: write
      packages: read
    uses: elijah286/LabVIEW-CI-with-Containers/.github/workflows/labview-ci.reusable.yml@v4
    with:
      labview-version: "2026"
    secrets: inherit
